# Tableau de bord « Basket » (URL : dashboard-basket)
# À coller dans : tableau de bord > crayon > ⋮ > Éditeur de configuration brute.
# Remplacer ID_FRANCIS et ID_ILONA par les user_id (voir la procédure).
# Carte HACS requise : auto-entities (menus de pronostics).
title: Basket
views:
  - title: Direct
    path: direct
    icon: mdi:basketball
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: En direct
            icon: mdi:broadcast
          - type: markdown
            content: |-
              {% set eu = [138, 141, 9357, 2165] %}
              {% set l = state_attr('sensor.basket_live_lives_en_cours', 'matchs') or [] %}
              {% if l | count == 0 %}*Aucun match en cours.*{% endif %}
              {% for m in l %}
              **{{ '🇪🇺' if m.tournoi_id in eu else '🇫🇷' }} {{ m.tournoi }}** · {{ m.statut }}{% if m.chrono %} · {{ m.chrono }}{% endif %}

              {% set ot = m.prolongation_dom is not none %}
              | | 1 | 2 | 3 | 4 |{% if ot %} P |{% endif %} **Total** |
              |:--|--:|--:|--:|--:|{% if ot %}--:|{% endif %}--:|
              | {{ m.domicile }} |{% for q in m.quarts_dom %} {{ q if q is not none else '·' }} |{% endfor %}{% if ot %} {{ m.prolongation_dom }} |{% endif %} **{{ m.score_dom if m.score_dom is not none else '·' }}** |
              | {{ m.exterieur }} |{% for q in m.quarts_ext %} {{ q if q is not none else '·' }} |{% endfor %}{% if ot %} {{ m.prolongation_ext }} |{% endif %} **{{ m.score_ext if m.score_ext is not none else '·' }}** |

              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Aujourd'hui et demain
            icon: mdi:calendar-clock
          - type: markdown
            content: |-
              {% set jours = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'] %}
              {% set eu = [138, 141, 9357, 2165] %}
              {% set l = state_attr('sensor.basket_live_matchs_a_venir', 'matchs') or [] %}
              {% if l | count == 0 %}*Aucun match prévu.*{% endif %}
              {% set ns = namespace(jour='') %}
              {% for m in l | sort(attribute='debut') %}
              {% set d = as_datetime(m.debut) | as_local %}
              {% set j = jours[d.weekday()] ~ ' ' ~ d.strftime('%d/%m') %}
              {% if j != ns.jour %}{% set ns.jour = j %}

              **{{ j }}**
              {% endif %}
              - {{ d.strftime('%H:%M') }} : {{ m.titre }} ({{ '🇪🇺' if m.tournoi_id in eu else '🇫🇷' }} {{ m.tournoi }}){% if m.code in [60, 70] %} · {{ m.statut }}{% endif %}
              {% endfor %}
          # Un menu par match à venir, pour le seul utilisateur connecté ; disparaît à l'entre-deux
          - type: custom:auto-entities
            visibility:
              - condition: user
                users:
                  - ID_FRANCIS
            card:
              type: entities
              title: Mes pronostics
            filter:
              include:
                - domain: select
                  attributes:
                    joueur: francis
            sort:
              method: attribute
              attribute: debut
            show_empty: false
          - type: custom:auto-entities
            visibility:
              - condition: user
                users:
                  - ID_ILONA
            card:
              type: entities
              title: Mes pronostics
            filter:
              include:
                - domain: select
                  attributes:
                    joueur: ilona
            sort:
              method: attribute
              attribute: debut
            show_empty: false
          - type: heading
            heading: Résultats des 7 derniers jours
            icon: mdi:scoreboard
          - type: markdown
            content: |-
              {% set jours = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'] %}
              {% set eu = [138, 141, 9357, 2165] %}
              {% set l = state_attr('sensor.basket_live_resultats', 'matchs') or [] %}
              {% if l | count == 0 %}*Aucun résultat.*{% endif %}
              {% set ns = namespace(jour='') %}
              {% for m in l | sort(attribute='debut', reverse=true) %}
              {% set d = as_datetime(m.debut) | as_local %}
              {% set j = jours[d.weekday()] ~ ' ' ~ d.strftime('%d/%m') %}
              {% if j != ns.jour %}{% set ns.jour = j %}

              **{{ j }}**
              {% endif %}
              - {{ m.domicile }} **{{ m.score_dom }} - {{ m.score_ext }}** {{ m.exterieur }}{{ ' a.p.' if m.prolongation_dom is not none else '' }} ({{ '🇪🇺' if m.tournoi_id in eu else '🇫🇷' }} {{ m.tournoi }})
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Mes notifications
            icon: mdi:bell-cog
          - type: entities
            visibility:
              - condition: user
                users:
                  - ID_FRANCIS
            entities:
              - entity: input_select.basket_suivi_francis
              - entity: input_boolean.basket_francis_live_nanterre
              - entity: input_boolean.basket_francis_resultat_nanterre
              - entity: input_boolean.basket_francis_resultats_elite
              - entity: input_boolean.basket_francis_resultats_europe
          - type: entities
            visibility:
              - condition: user
                users:
                  - ID_ILONA
            entities:
              - entity: input_select.basket_suivi_ilona
              - entity: input_boolean.basket_ilona_live_nanterre
              - entity: input_boolean.basket_ilona_resultat_nanterre
              - entity: input_boolean.basket_ilona_resultats_elite
              - entity: input_boolean.basket_ilona_resultats_europe
          - type: entities
            title: État de la source
            visibility:
              - condition: user
                users:
                  - ID_FRANCIS
            entities:
              - entity: binary_sensor.basket_live_websocket
              - entity: sensor.basket_live_requetes_du_jour
              - entity: sensor.basket_live_dernier_calendrier
              - entity: button.basket_live_rafraichir_le_calendrier

  - title: Pronostics
    path: pronostics
    icon: mdi:crystal-ball
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Classement
            icon: mdi:podium
          - type: markdown
            content: |-
              {% set c = state_attr('sensor.basket_live_classement', 'joueurs') or [] %}
              {% set medailles = ['🥇', '🥈', '🥉'] %}
              {% for j in c %}
              {{ medailles[loop.index0] if loop.index0 < 3 else '' }} **{{ j.nom }}** · {{ j.points }} pt{{ 's' if j.points > 1 else '' }} · {{ j.bons }} bon{{ 's' if j.bons > 1 else '' }} pronostic{{ 's' if j.bons > 1 else '' }} sur {{ j.pronos }}
              {% endfor %}

              *Saison {{ state_attr('sensor.basket_live_classement', 'saison') }} · 2 points pour un match de Nanterre, 1 pour les autres.*
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Matchs pronostiqués
            icon: mdi:history
          - type: markdown
            content: |-
              {% set eu = [138, 141, 9357, 2165] %}
              {% set l = state_attr('sensor.basket_live_pronostics', 'matchs') or [] %}
              {% macro cellule(m, j) -%}
                {%- set p = m.pronos[j] -%}
                {%- set r = m.resultats[j] -%}
                {%- if p is none -%}·
                {%- elif r is none -%}{{ p }}
                {%- elif r -%}<font color="#2e7d32">✔ {{ p }} (+{{ m.points[j] }})</font>
                {%- else -%}<font color="#c62828">✘ {{ p }}</font>
                {%- endif -%}
              {%- endmacro %}
              {% if l | count == 0 %}*Aucun match pronostiqué pour l'instant. Les pronostics apparaissent ici à l'entre-deux.*{% else %}
              | Date | Match | Score | Ilona | Francis |
              |:--|:--|:-:|:--|:--|
              {% for m in l %}{% set d = as_datetime(m.debut) | as_local %}| {{ d.strftime('%d/%m') }} | {{ '🇪🇺' if m.tournoi_id in eu else '🇫🇷' }} {{ m.domicile }} - {{ m.exterieur }} | {{ m.score if m.termine else '*en cours*' }} | {{ cellule(m, 'ilona') }} | {{ cellule(m, 'francis') }} |
              {% endfor %}{% endif %}
