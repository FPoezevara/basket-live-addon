# Tableau de bord « Basket » (URL : dashboard-basket), tel qu'exporté par l'éditeur de HA le 05/11/2026.
# À coller dans : tableau de bord > crayon > ⋮ > Éditeur de configuration brute.
# Visibilité par utilisateur : Francis c2af4c5a…, Ilona 7521abea… (user_id HA).
# Ressource supplémentaire : /local/basket-historique-card.js?v=1.4.1 (module).
# Ressource requise : /local/basket-a-venir-card.js?v=1.3.0 (module), copie de www/basket-a-venir-card.js.
title: Basket
views:
  - title: Direct
    path: direct
    icon: mdi:basketball
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:basket-entete-card
            titre: Basket Live
      - type: grid
        column_span: 2
        cards:
          - type: custom:basket-score-direct-card
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Les 7 prochains jours
            icon: mdi:calendar-clock
          - type: custom:basket-a-venir-card
            joueurs:
              c2af4c5a136e448ab37deaae63146536: francis
              7521abea3321478f8c461ee465767fcb: ilona
      - type: grid
        cards:
          - type: heading
            heading: Mes notifications
            icon: mdi:bell-cog
          - type: entities
            visibility:
              - condition: user
                users:
                  - c2af4c5a136e448ab37deaae63146536
            entities:
              - entity: input_boolean.basket_francis_live_nanterre
              - entity: input_boolean.basket_francis_resultat_nanterre
              - entity: input_boolean.basket_francis_resultats_elite
              - entity: input_boolean.basket_francis_resultats_europe
          - type: entities
            visibility:
              - condition: user
                users:
                  - 7521abea3321478f8c461ee465767fcb
            entities:
              - entity: input_boolean.basket_ilona_live_nanterre
              - entity: input_boolean.basket_ilona_resultat_nanterre
              - entity: input_boolean.basket_ilona_resultats_elite
              - entity: input_boolean.basket_ilona_resultats_europe
          - type: entities
            title: État de la source
            visibility:
              - condition: user
                users:
                  - c2af4c5a136e448ab37deaae63146536
            entities:
              - entity: binary_sensor.basket_live_websocket
              - entity: sensor.basket_live_requetes_du_jour
              - entity: sensor.basket_live_dernier_calendrier
              - entity: button.basket_live_rafraichir_le_calendrier
  - title: Pronostics
    path: pronostics
    icon: mdi:crystal-ball
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:basket-entete-card
            titre: Basket Live
          - type: custom:basket-pronostics-card
            grid_options:
              columns: full

  - title: Historique
    path: historique
    icon: mdi:history
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:basket-entete-card
            titre: Basket Live
          - type: custom:basket-historique-card
            capteur: sensor.basket_live_resultats_saison
            grid_options:
              columns: full

  - title: Classements
    path: classements
    icon: mdi:podium
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:basket-entete-card
            titre: Basket Live
          - type: custom:basket-classements-card
            grid_options:
              columns: full
