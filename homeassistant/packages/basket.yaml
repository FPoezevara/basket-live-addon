# =====================================================================
# Basket Live : préférences, lives et résultats sur les téléphones
# Emplacement : /homeassistant/packages/basket.yaml
# Dépend de l'add-on basket_live (capteurs sensor.basket_live_*,
# événements MQTT sur basket_live/evenement).
#
# Par personne :
#   - 4 interrupteurs : live Nanterre, résultat Nanterre,
#     résultats Élite, résultats Europe ;
#   - plusieurs boutons Live dans la carte Aujourd'hui et demain ;
#     les choix sont conservés par l'add-on et publiés en MQTT.
# Les anciens input_text ne servent plus qu'à migrer le choix unique existant.
# Règle « le live suffit » : qui suit un match en live ne reçoit pas
# en plus la notification de résultat.
# =====================================================================

input_boolean:
  basket_francis_live_nanterre:
    name: Live des matchs de Nanterre
    icon: mdi:basketball
  basket_francis_resultat_nanterre:
    name: Résultat des matchs de Nanterre
    icon: mdi:scoreboard
  basket_francis_resultats_elite:
    name: Résultats de la Betclic Élite
    icon: mdi:trophy
  basket_francis_resultats_europe:
    name: Résultats européens des clubs français
    icon: mdi:earth
  basket_ilona_live_nanterre:
    name: Live des matchs de Nanterre
    icon: mdi:basketball
  basket_ilona_resultat_nanterre:
    name: Résultat des matchs de Nanterre
    icon: mdi:scoreboard
  basket_ilona_resultats_elite:
    name: Résultats de la Betclic Élite
    icon: mdi:trophy
  basket_ilona_resultats_europe:
    name: Résultats européens des clubs français
    icon: mdi:earth

input_text:
  basket_suivi_francis_id:
    name: Francis, identifiant du match suivi
    max: 20
  basket_suivi_ilona_id:
    name: Ilona, identifiant du match suivi
    max: 20

script:
  basket_live_selectionner:
    alias: Basket - choisir le suivi d'un match
    mode: queued
    max: 50
    fields:
      personne:
        description: francis ou ilona
      match_id:
        description: Identifiant du match
      actif:
        description: true pour suivre, false pour arrêter ce match
    sequence:
      - condition: template
        value_template: >-
          {{ personne in ['francis', 'ilona'] and (match_id | int(0)) > 0
             and actif is boolean }}
      # L'événement conserve le contexte du compte connecté. L'automatisation
      # ci-dessous contrôle l'identité puis publie une commande MQTT bornée.
      - event: basket_live_selection_demandee
        event_data:
          personne: "{{ personne }}"
          match_id: "{{ match_id | int }}"
          actif: "{{ actif }}"

  basket_prono_rappeler:
    alias: Basket - rappeler les pronostics manquants
    mode: queued
    max: 20
    fields:
      echeance:
        description: Groupe personnel de matchs à pronostiquer au même horaire
    sequence:
      - condition: template
        value_template: >-
          {{ echeance.personne in ['francis', 'ilona']
             and now().timestamp() < echeance.debut }}
      - variables:
          personne: "{{ echeance.personne }}"
          # Vérification locale supplémentaire : un pronostic peut avoir été fait
          # depuis la préparation du rappel par l'add-on.
          restants: >-
            {% set ns = namespace(l=[]) %}
            {% for m in echeance.matchs %}
              {% set menus = states.select
                   | selectattr('attributes.joueur', 'defined')
                   | selectattr('attributes.joueur', 'eq', echeance.personne)
                   | selectattr('attributes.match_id', 'defined')
                   | selectattr('attributes.match_id', 'eq', m.id) | list %}
              {% set faits = menus | rejectattr('state', 'in', ['—', 'unknown', 'unavailable']) | list %}
              {% if faits | count == 0 %}{% set ns.l = ns.l + [m] %}{% endif %}
            {% endfor %}
            {{ ns.l }}
          heure: "{{ echeance.debut | timestamp_custom('%H:%M', true) }}"
          etiquette: "basket_prono_{{ echeance.debut | int }}"
      - condition: template
        value_template: "{{ restants | count > 0 }}"
      - variables:
          titre: "{{ 'Pronostic à faire' if restants | count == 1 else 'Pronostics à faire' }} · {{ heure }}"
          texte: >-
            Tu n'as pas encore pronostiqué : {{ restants | map(attribute='titre') | join(' ; ') }}.
            Pense à le faire avant le début à {{ heure }}.
      - choose:
          - conditions: "{{ personne == 'francis' }}"
            sequence:
              - action: notify.mobile_app_iphone_de_francis_2
                data:
                  title: "{{ titre }}"
                  message: "{{ texte }}"
                  data:
                    tag: "{{ etiquette }}"
                    group: basket-pronostics
                    notification_icon: mdi:crystal-ball
                    url: /dashboard-basket/direct
          - conditions: "{{ personne == 'ilona' }}"
            sequence:
              - action: notify.mobile_app_sm_g998u1
                data:
                  title: "{{ titre }}"
                  message: "{{ texte }}"
                  data:
                    tag: "{{ etiquette }}"
                    group: basket-pronostics
                    channel: Basket pronostics
                    importance: default
                    alert_once: true
                    notification_icon: mdi:crystal-ball
                    clickAction: /dashboard-basket/direct

  # Nouvelles étoiles de badges, groupées par l'add-on : une notification par annonce.
  basket_badge_annoncer:
    alias: Basket - annoncer de nouvelles étoiles
    mode: queued
    max: 20
    fields:
      echeance:
        description: Annonce publiée par l'add-on (personne, badges)
    sequence:
      - condition: template
        value_template: >-
          {{ echeance.personne in ['francis', 'ilona']
             and echeance.badges is list and echeance.badges | count > 0 }}
      - variables:
          personne: "{{ echeance.personne }}"
          titre: >-
            {{ 'Nouvelle étoile' if echeance.badges | count == 1 else 'Nouvelles étoiles' }}
          # « Ultra Nanterrienne ★★★☆☆ : 10 victoires de Nanterre… », une ligne par badge
          texte: >-
            {% set ns = namespace(l=[]) %}
            {% for b in echeance.badges %}
              {% set n = b.niveau | int(0) %}
              {% set ns.l = ns.l + [b.nom ~ ' ' ~ '★' * n ~ '☆' * (5 - n) ~ ' : ' ~ b.description] %}
            {% endfor %}
            {{ ns.l | join('\n') }}
          etiquette: "basket_{{ echeance.cle | replace(':', '_') }}"
      - choose:
          - conditions: "{{ personne == 'francis' }}"
            sequence:
              - action: notify.mobile_app_iphone_de_francis_2
                data:
                  title: "{{ titre }}"
                  message: "{{ texte }}"
                  data:
                    tag: "{{ etiquette }}"
                    group: basket-badges
                    notification_icon: mdi:star-circle
                    url: /dashboard-basket/pronostics
                    push:
                      sound: default
          - conditions: "{{ personne == 'ilona' }}"
            sequence:
              - action: notify.mobile_app_sm_g998u1
                data:
                  title: "{{ titre }}"
                  message: "{{ texte }}"
                  data:
                    tag: "{{ etiquette }}"
                    group: basket-badges
                    channel: Basket badges
                    importance: default
                    notification_icon: mdi:star-circle
                    clickAction: /dashboard-basket/pronostics

  basket_notification_executer:
    alias: Basket - traiter une échéance persistante
    mode: queued
    max: 50
    fields:
      cle:
        description: Identifiant de l'échéance publiée par l'add-on
    sequence:
      - variables:
          # Relire la tâche actuelle, plutôt que réutiliser une copie potentiellement ancienne.
          echeance: >-
            {{ (state_attr('sensor.basket_live_notifications', 'echeances') or [])
               | selectattr('cle', 'eq', cle) | first | default(none) }}
      - condition: template
        value_template: >-
          {{ echeance is mapping and echeance.personne in ['francis', 'ilona']
             and echeance.echeance <= now().timestamp() }}
      - choose:
          - conditions: "{{ echeance.type == 'fermeture' }}"
            sequence:
              - action: script.basket_live_clore
                data:
                  personne: "{{ echeance.personne }}"
                  match_id: "{{ echeance.match_id }}"
          - conditions: "{{ echeance.type == 'rappel_prono' }}"
            sequence:
              - action: script.basket_prono_rappeler
                data:
                  echeance: "{{ echeance }}"
          - conditions: "{{ echeance.type == 'badge' }}"
            sequence:
              - action: script.basket_badge_annoncer
                data:
                  echeance: "{{ echeance }}"
      # Une erreur de notification interrompt le script avant cet acquittement :
      # la tâche reste alors disponible pour le prochain passage.
      - action: mqtt.publish
        data:
          topic: basket_live/notification/ack
          payload: "{{ {'cle': cle} | to_json }}"
          qos: 1
          retain: false
      # Évite de retraiter la même tâche entre l'acquittement et la republication MQTT.
      - wait_template: >-
          {{ cle not in ((state_attr('sensor.basket_live_notifications', 'echeances') or [])
             | map(attribute='cle') | list) }}
        timeout: "00:00:05"
        continue_on_timeout: true

  # Live : Live Activity sur l'iPhone de Francis, notification persistante
  # mise à jour sur place chez Ilona (Android 15, pas de Live Update).
  basket_live_pousser:
    alias: Basket - pousser un live
    mode: parallel
    max: 20
    fields:
      personne:
        description: francis ou ilona
      match:
        description: Objet match publié par l'add-on
      final:
        description: true pour la fin confirmée (notification libérée chez Ilona)
    sequence:
      # Mise en page : équipes en titre, score seul à droite (gros caractères, Dynamic Island),
      # une seule ligne d'état en dessous, barre de progression = avancement du match.
      # Les « | default » couvrent un add-on antérieur à la 0.1.1 (sans noms courts ni temps joué).
      - variables:
          dom: "{{ match.domicile_court | default(match.domicile) }}"
          ext: "{{ match.exterieur_court | default(match.exterieur) }}"
          a_score: "{{ match.score_dom is not none and match.score_ext is not none }}"
          score: "{{ match.score_dom ~ ' - ' ~ match.score_ext if a_score else '' }}"
          ligne: >-
            {{ match.statut_court | default(match.statut) }}{% if match.chrono and not final %} · {{ match.chrono }}{% endif %} · {{ match.tournoi_court | default(match.tournoi) }}
          # Avancement global sur 100 : 25 % par quart-temps (0.1.2), sinon calculé sur 40 min
          avance: >-
            {% if match.progression is defined and match.progression is not none %}{{ match.progression }}
            {% else %}{{ [100, ((match.temps_joue | default(0, true) | int(0)) * 100 / 2400) | round(0) | int] | min }}{% endif %}
          etiquette: "basket_{{ match.id }}"
      - choose:
          - conditions: "{{ personne == 'francis' }}"
            sequence:
              - action: notify.mobile_app_iphone_de_francis_2
                data:
                  # Mise en page imposée par l'app (HALockScreenView) : icône | titre sur 1 ligne,
                  # message dessous | colonne de droite ; barre de progression sur toute la largeur.
                  title: "{{ dom }} - {{ ext }}"
                  message: "{{ ligne }}"
                  data:
                    tag: "{{ etiquette }}"
                    live_update: true
                    # Même champ pour la colonne de droite de l'écran verrouillé et la partie droite
                    # de la Dynamic Island compacte (50 pt max) : score compact, sans espaces.
                    # Avant l'entre-deux : l'heure, pour ne pas afficher le pourcentage de la barre.
                    critical_text: >-
                      {{ match.score_dom ~ '-' ~ match.score_ext if a_score
                         else (as_datetime(match.debut) | as_local).strftime('%H:%M') if match.debut is defined
                         else match.statut_court | default(match.statut) }}
                    progress: "{{ avance }}"
                    progress_max: 100
                    notification_icon: mdi:basketball
                    notification_icon_color: "#F26B1D"
                    url: /dashboard-basket/direct
          - conditions: "{{ personne == 'ilona' }}"
            sequence:
              - action: notify.mobile_app_sm_g998u1
                data:
                  # Android a toute la largeur : le score tient dans le titre
                  title: "{{ dom ~ '  ' ~ score ~ '  ' ~ ext if a_score else dom ~ ' - ' ~ ext }}"
                  message: "{{ ligne }}"
                  data:
                    tag: "{{ etiquette }}"
                    progress: "{{ avance }}"
                    progress_max: 100
                    # Canal créé au premier envoi, sans son ; alert_once : pas de vibration aux mises à jour
                    channel: Basket live
                    importance: low
                    alert_once: true
                    sticky: true
                    persistent: "{{ not final }}"
                    notification_icon: mdi:basketball
                    clickAction: /dashboard-basket/direct

  basket_live_resultat:
    alias: Basket - notifier un résultat
    mode: parallel
    max: 20
    fields:
      personne:
        description: francis ou ilona
      match:
        description: Objet match publié par l'add-on
    sequence:
      - variables:
          corps: >-
            {{ match.domicile }} {{ match.score_dom }} - {{ match.score_ext }} {{ match.exterieur }}{{ ' (a.p.)' if match.prolongation_dom is not none else '' }}
          etiquette: "basket_res_{{ match.id }}"
      - choose:
          - conditions: "{{ personne == 'francis' }}"
            sequence:
              - action: notify.mobile_app_iphone_de_francis_2
                data:
                  title: "{{ match.tournoi }}"
                  message: "{{ corps }}"
                  data:
                    tag: "{{ etiquette }}"
                    group: basket-resultats
                    url: /dashboard-basket/direct
                    push:
                      # Pas de son ni d'allumage d'écran : rangée dans le centre de notifications
                      interruption-level: passive
          - conditions: "{{ personne == 'ilona' }}"
            sequence:
              - action: notify.mobile_app_sm_g998u1
                data:
                  title: "{{ match.tournoi }}"
                  message: "{{ corps }}"
                  data:
                    tag: "{{ etiquette }}"
                    group: basket-resultats
                    channel: Basket résultats
                    importance: low
                    clickAction: /dashboard-basket/direct

  basket_live_clore:
    alias: Basket - clore un live
    mode: parallel
    max: 20
    fields:
      personne:
        description: francis ou ilona
      match_id:
        description: Identifiant du match
    sequence:
      - action: "{{ 'notify.mobile_app_iphone_de_francis_2' if personne == 'francis' else 'notify.mobile_app_sm_g998u1' }}"
        data:
          message: clear_notification
          data:
            tag: "basket_{{ match_id }}"

automation:
  - id: basket_live_selection_autorisee
    alias: Basket - transmettre un choix Live personnel
    description: Autorise chaque compte à modifier ses propres suivis, puis transmet à MQTT
    mode: queued
    max: 50
    triggers:
      - trigger: event
        event_type: basket_live_selection_demandee
    variables:
      # Même correspondance que joueurs: dans dashboard-basket.yaml.
      comptes:
        c2af4c5a136e448ab37deaae63146536: francis
        7521abea3321478f8c461ee465767fcb: ilona
    conditions:
      - condition: template
        value_template: >-
          {% set d = trigger.event.data %}
          {% set uid = trigger.event.context.user_id %}
          {{ d.personne | default('') in ['francis', 'ilona']
             and d.match_id is defined and (d.match_id | int(0)) > 0
             and d.actif is defined and d.actif is boolean
             and (uid is none or comptes.get(uid) == d.personne) }}
    actions:
      - action: mqtt.publish
        data:
          topic: "basket_live/suivi/{{ trigger.event.data.personne }}/{{ trigger.event.data.match_id | int }}/set"
          payload: "{{ 'ON' if trigger.event.data.actif else 'OFF' }}"
          qos: 1
          retain: false

  - id: basket_live_evenements
    alias: Basket - lives et résultats
    description: Relaie les événements de l'add-on selon les préférences de chacun
    mode: queued
    max: 50
    triggers:
      - trigger: mqtt
        topic: basket_live/evenement
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.payload_json is defined
             and trigger.payload_json.type in ['debut', 'maj', 'periode', 'fin_provisoire', 'reprise', 'fin', 'suivi_actif', 'suivi_arrete'] }}
    actions:
      - variables:
          type_evt: "{{ trigger.payload_json.type }}"
          match: "{{ trigger.payload_json.match }}"
          final: "{{ trigger.payload_json.type == 'fin' }}"
      - repeat:
          for_each:
            - francis
            - ilona
          sequence:
            - variables:
                p: "{{ repeat.item }}"
                concerne: >-
                  {{ type_evt not in ['suivi_actif', 'suivi_arrete']
                     or trigger.payload_json.personne | default('') == repeat.item }}
                # Les destinataires sont capturés dans l'événement : la liste de choix
                # peut déjà être nettoyée lorsque HA traite une fin confirmée.
                suit_live: >-
                  {% set p = repeat.item %}
                  {% set choix = state_attr('sensor.basket_live_suivis_' ~ p, 'choix') or {} %}
                  {% set manuel = p in trigger.payload_json.suivis
                       if trigger.payload_json.suivis is defined
                       else (choix.get(match.id | string) is sameas true) %}
                  {% set exclu = p in trigger.payload_json.exclus
                       if trigger.payload_json.exclus is defined
                       else (choix.get(match.id | string) is sameas false) %}
                  {{ manuel or (match.categorie == 'nanterre' and not exclu
                     and is_state('input_boolean.basket_' ~ p ~ '_live_nanterre', 'on')) }}
                veut_resultat: >-
                  {% set cle = {'nanterre': 'resultat_nanterre', 'elite': 'resultats_elite',
                                'europe': 'resultats_europe'}.get(match.categorie) %}
                  {{ cle is not none and is_state('input_boolean.basket_' ~ repeat.item ~ '_' ~ cle, 'on') }}
            - choose:
                # Un ancien événement fin reçu après l'échéance ne doit pas recréer le live.
                - conditions: >-
                    {{ final and suit_live
                       and (as_timestamp(match.termine_le | default(none), 0) + 1800) <= now().timestamp() }}
                  sequence:
                    - action: script.basket_live_clore
                      data:
                        personne: "{{ p }}"
                        match_id: "{{ match.id }}"
                - conditions: "{{ type_evt == 'suivi_arrete' and concerne }}"
                  sequence:
                    - action: script.basket_live_clore
                      data:
                        personne: "{{ p }}"
                        match_id: "{{ match.id }}"
                - conditions: >-
                    {{ suit_live and concerne and type_evt != 'suivi_arrete'
                       and (type_evt != 'suivi_actif' or match.en_cours or match.fin_provisoire) }}
                  sequence:
                    - action: script.basket_live_pousser
                      data:
                        personne: "{{ p }}"
                        match: "{{ match }}"
                        final: "{{ final }}"
                # « Tardif » : fin rattrapée longtemps après coup, pas de notification
                - conditions: "{{ final and veut_resultat and not match.tardif }}"
                  sequence:
                    - action: script.basket_live_resultat
                      data:
                        personne: "{{ p }}"
                        match: "{{ match }}"
            - if:
                - condition: template
                  value_template: "{{ final and (states('input_text.basket_suivi_' ~ p ~ '_id') | int(0)) == match.id }}"
              then:
                - action: input_text.set_value
                  target:
                    entity_id: "input_text.basket_suivi_{{ p }}_id"
                  data:
                    value: ""

  - id: basket_notifications_echeances
    alias: Basket - échéances persistantes des notifications
    description: Ferme les lives échus, traite les rappels de pronostics et annonce les nouvelles étoiles, y compris après un redémarrage
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.basket_live_notifications
        attribute: echeances
      - trigger: time_pattern
        minutes: /1
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.basket_live_notifications') not in ['unknown', 'unavailable'] }}
    actions:
      - repeat:
          for_each: >-
            {{ (state_attr('sensor.basket_live_notifications', 'echeances') or [])
               | selectattr('echeance', 'le', now().timestamp()) | list }}
          sequence:
            - action: script.basket_notification_executer
              continue_on_error: true
              data:
                cle: "{{ repeat.item.cle }}"

  - id: basket_live_migrer_suivi
    alias: Basket - migrer l'ancien choix de match
    description: Reprend le choix unique antérieur sans écraser un choix déjà fait avec les boutons
    mode: queued
    max: 3
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - sensor.basket_live_suivis_francis
          - sensor.basket_live_suivis_ilona
        attribute: choix
      - trigger: time_pattern
        minutes: /5
    actions:
      - repeat:
          for_each:
            - francis
            - ilona
          sequence:
            - variables:
                p: "{{ repeat.item }}"
                ancien: "{{ states('input_text.basket_suivi_' ~ repeat.item ~ '_id') | int(0) }}"
                choix: "{{ state_attr('sensor.basket_live_suivis_' ~ repeat.item, 'choix') }}"
                disponibles: >-
                  {{ (state_attr('sensor.basket_live_matchs_a_venir', 'matchs') or [])
                     + (state_attr('sensor.basket_live_lives_en_cours', 'matchs') or []) }}
            - if:
                - condition: template
                  value_template: >-
                    {{ ancien > 0 and choix is mapping
                       and states('sensor.basket_live_suivis_' ~ p) not in ['unknown', 'unavailable'] }}
              then:
                - choose:
                    # Effacer l'ancien identifiant uniquement après confirmation par l'add-on.
                    - conditions: "{{ (ancien | string) in choix }}"
                      sequence:
                        - action: input_text.set_value
                          target:
                            entity_id: "input_text.basket_suivi_{{ p }}_id"
                          data:
                            value: ""
                    - conditions: "{{ disponibles | selectattr('id', 'eq', ancien) | list | count > 0 }}"
                      sequence:
                        - action: script.basket_live_selectionner
                          data:
                            personne: "{{ p }}"
                            match_id: "{{ ancien }}"
                            actif: true

# Les attributs des lives changent à chaque panier : on ne les garde pas dans le recorder.
# Si configuration.yaml contient déjà un bloc « recorder: », supprimer ce bloc-ci et ajouter
# l'entité sous recorder > exclude > entities de configuration.yaml (deux blocs = erreur).
recorder:
  exclude:
    entities:
      - sensor.basket_live_lives_en_cours
      - sensor.basket_live_resultats_saison
    entity_globs:
      - sensor.basket_live_statistiques_*
